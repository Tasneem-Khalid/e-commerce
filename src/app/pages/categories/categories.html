<section class="container">
    <h1 class="gradient-text font-bold text-5xl text-center my-6 ">All Available Categories</h1>
        <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">

        @for (category of storeCategories; track $index) {

            <div class="card flex flex-col h-full w-full bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden dark:bg-gray-800 dark:border-gray-500">
                
                    <img class="p-2 rounded-2xl hover:scale-[105%] h-[350px] transition-all duration-150" [src]="category.image" [alt]="category.slug" />
                
                <div class="px-5 pb-5">
                        <h2 class="gradient-text text-2xl font-semibold mt-4 text-center">{{category.name}}</h2>
                </div>
            </div>
        }

    </div>
</section>
