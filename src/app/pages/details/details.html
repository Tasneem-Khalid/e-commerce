<section class="container">


    <div class="grid grid-cols-12 items-center gap-5">

        <div class="slider col-span-4">

        <owl-carousel-o [options]="productImagesSlider">

            @for (img of productDetails.images; track $index) {
            <ng-template carouselSlide>
                <img [src]="img" [alt]="productDetails.slug">
            </ng-template>
            }

        </owl-carousel-o>
        </div>

        <div class="details col-span-8 p-8">

            <h1 class="text-3xl font-semibold mb-4 dark:text-gray-200">{{productDetails.title}}</h1>
            <p class="my-2.5 text-gray-500 text-lg">{{productDetails.description}}</p>
            <h5 class="gradient-text text-lg font-semibold">{{productDetails.category.name}}</h5>

            <div class="flex justify-between align-middle mt-10">
                <span class="text-3xl font-bold text-gray-900 dark:text-gray-300">{{productDetails.price | currency: 'EGP':'code'}}</span>
                <div class="flex items-center mt-2.5 my-10">
                        <div class="flex items-center space-x-1 rtl:space-x-reverse">
                            <i class="fa-solid fa-star text-amber-500 text-lg "></i>
                            <i class="fa-solid fa-star text-amber-500 text-lg "></i>
                            <i class="fa-solid fa-star text-amber-500 text-lg "></i>
                            <i class="fa-solid fa-star text-amber-500 text-lg "></i>
                            <i class="fa-solid fa-star-half text-amber-500 text-lg "></i>
                        </div>
                        <span class=" bg-gradient-to-r from-blue-100 to-violet-200 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-sm dark:bg-blue-200  ms-3">{{productDetails.ratingsAverage}}</span>
                </div>


                
            </div>
            <button
            (click)="addProductToCart(productDetails._id)"
            type="button" class="w-full main-btn hover:scale-[105%] transition-all duration-75"><i class="fa-solid fa-cart-shopping text-3xl"></i></button>
        </div>
    </div>
</section>
