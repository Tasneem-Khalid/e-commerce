<section class="container">

    <h2 class="gradient-text font-bold text-5xl text-center my-6 ">Shop the full collection</h2>
    <div class="searchInput my-4">
        <div class="relative">
            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                </svg>
            </div>
            <input [(ngModel)]="searchTerm"
            type="search"
            id="default-search"
            class="block w-full p-4 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
            placeholder="What are you looking for . . . ?" />
        </div>
    </div>

    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">

        @for (product of productList | paginate: { id: 'foo',
                                                    itemsPerPage: pageSize,
                                                    currentPage: p,
                                                    totalItems: total } | search:searchTerm ; track $index) {

            <div class="card flex flex-col h-full w-full bg-white border overflow-hidden border-gray-200 rounded-lg shadow-sm  dark:bg-gray-800 dark:border-gray-500">
                <a [routerLink]="['/details', product._id]">
                    <img class="p-2 rounded-2xl hover:scale-[110%] transition-all duration-150" [src]="product.imageCover" [alt]="product.brand.slug" />
                </a>
                <div class="px-5 pb-5 flex-1 flex flex-col">
                    <a [routerLink]="['/details', product._id]" class="product-category">
                        <h5 class="gradient-text mt-4 text-sm font-semibold">{{product.category.name}}</h5>
                    </a>

                    <a [routerLink]="['/details', product._id]" class="product-title">

                        <h5 class="text-lg font-semibold tracking-tight text-gray-900 dark:text-gray-300">{{product.title}}</h5>
                    </a>
                    <!-- rating -->
                    <div class="flex items-center mt-2.5 mb-5">
                        <div class="flex items-center space-x-1 rtl:space-x-reverse">
                            <i class="fa-solid fa-star text-amber-500"></i>
                            <i class="fa-solid fa-star text-amber-500"></i>
                            <i class="fa-solid fa-star text-amber-500"></i>
                            <i class="fa-solid fa-star text-amber-500"></i>
                            <i class="fa-solid fa-star-half text-amber-500"></i>
                        </div>
                        <span class="bg-gradient-to-r from-blue-100 to-violet-200 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-sm dark:bg-blue-200  ms-3">{{product.ratingsAverage}}</span>
                    </div>
        
                    <div class="flex items-center justify-between mt-auto">
                        <span class="text-xl font-bold text-gray-900 dark:text-gray-300">{{product.price  | currency: 'EGP':'code'}}</span>
                        <button
                        (click)="addProductToCart(product._id)"
                        type="button" class="main-btn hover:scale-[105%] transition-all duration-75"><i class="fa-solid fa-cart-shopping "></i></button>
        
                    </div>
                </div>
            </div>
        }

    </div>

    <div class="flex justify-center mt-7">
        <pagination-controls  id="foo" (pageChange)="allProductsData($event)"></pagination-controls>

    </div>

</section>
